<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="logo">
      <span class="logo-icone">🏋️</span>
      <span class="logo-texto">Creatina<strong>Fit</strong></span>
    </div>

    <h2>Dashboard</h2>
  </header>

  <section class="cards-indicadores">
    <div class="card">
      <span class="card-valor">{{ totalAlunos() }}</span>
      <span class="card-label">Total de Alunos</span>
    </div>

    <div class="card">
      <span class="card-valor">{{ alunosAtivos() }}</span>
      <span class="card-label">Alunos Ativos</span>
    </div>

    <div class="card card-alerta">
      <span class="card-valor">{{ planosVencidos() }}</span>
      <span class="card-label">Planos Vencidos</span>
    </div>

    <div class="card">
      <span class="card-valor">{{ totalTurmas() }}</span>
      <span class="card-label">Turmas Ativas</span>
    </div>
  </section>

  <section class="graficos-grid">
    <div class="grafico-container">
      <h3>Alunos por Plano</h3>
      <canvas baseChart [type]="graficoTipo" [data]="graficoDados"></canvas>
    </div>

    <div class="grafico-container">
      <h3>Turmas por Modalidade</h3>
      <canvas baseChart [type]="graficoTipoPizza" [data]="graficoDadosPizza"></canvas>
    </div>
  </section>
</div>
